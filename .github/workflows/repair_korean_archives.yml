name: Repair Korean Archives

on:
  workflow_dispatch:
    inputs:
      dates:
        description: 'Comma-separated archive dates (YYYY-MM-DD)'
        required: true
        type: string
      limit:
        description: 'Maximum repairs per file (0 = all)'
        required: false
        default: '0'
        type: string

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Repair fallback entries
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: qwen/qwen3.8-27b
          GROQ_MIN_REQUEST_INTERVAL_SECONDS: '12'
          REPAIR_DATES: ${{ inputs.dates }}
          REPAIR_LIMIT: ${{ inputs.limit }}
        run: python scripts/repair_archive_korean.py --dates "$REPAIR_DATES" --limit "$REPAIR_LIMIT"

      - name: Commit repaired archives
        if: always() && github.ref == 'refs/heads/main'
        env:
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME || 'JCURVEs' }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL || 'JCURVEs@users.noreply.github.com' }}
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add archive/
          if git diff --staged --quiet; then
            echo "No repaired archive changes."
          else
            git commit -m "docs: Repair Korean archive summaries"
            git push
          fi
