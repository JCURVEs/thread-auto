name: Thread-Auto Daily Run

on:
  schedule:
    # 매일 한국 시간 오전 7시 30분 (전날 UTC 22:30) 실행
    - cron: '30 22 * * *'
    # GitHub 예약 실행 누락에 대비한 오전 8시 30분 백업
    - cron: '30 23 * * *'
  workflow_dispatch: # 수동 실행 버튼 (테스트용)
    inputs:
      ai_provider:
        description: 'AI Provider (groq)'
        required: false
        default: 'groq'
      dry_run:
        description: 'Dry Run Mode (true/false)'
        required: false
        default: 'true'

concurrency:
  group: thread-auto-daily
  cancel-in-progress: false

jobs:
  thread-auto-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Git 푸시 권한

    steps:
    - name: 📥 리포지토리 체크아웃
      uses: actions/checkout@v4

    - name: 당일 성공 실행 확인
      id: preflight
      shell: bash
      run: |
        RUN_YEAR=$(TZ=Asia/Seoul date +'%Y')
        RUN_MONTH=$(TZ=Asia/Seoul date +'%m월')
        RUN_DATE=$(TZ=Asia/Seoul date +'%Y-%m-%d')
        LOG_PATH="logs/daily/${RUN_YEAR}/${RUN_MONTH}/${RUN_DATE}.md"

        if [ "${{ github.event_name }}" = "schedule" ] \
          && [ -f "$LOG_PATH" ] \
          && grep -q -- '- Pipeline status: success' "$LOG_PATH"; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "Today's successful run already exists: $LOG_PATH"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "No successful run found for today. Starting pipeline."
        fi

    - name: 🐍 Python 설정 (3.10)
      if: steps.preflight.outputs.skip != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 📦 라이브러리 설치
      if: steps.preflight.outputs.skip != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium

    - name: 🚀 Thread-Auto 파이프라인 실행
      if: steps.preflight.outputs.skip != 'true'
      env:
        # AI Provider 설정 (기본: Groq 무료 티어)
        AI_PROVIDER: ${{ github.event.inputs.ai_provider || 'groq' }}
        AI_PROVIDER_FALLBACKS: 'groq'
        ALLOW_PAID_MODELS: 'false'
        AI_MODEL: ${{ vars.AI_MODEL || '' }}
        GROQ_MODEL: ${{ vars.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
        GROQ_MIN_REQUEST_INTERVAL_SECONDS: '12'
        GEMINI_MODEL: ${{ vars.GEMINI_MODEL || '' }}
        
        # API Keys (GitHub Secrets에 등록)
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        
        # Threads 설정
        THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

        # RSS 및 실행 모드 (빈 값 = 모든 AI 회사 블로그에서 수집)
        RSS_URL: ${{ vars.RSS_URL || '' }}
        COLLECT_ALL_SOURCES: 'true'
        DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'true' }}
        REQUIRE_DAILY_ARTICLE: 'true'
        ENABLE_PENDING_ARCHIVE: 'true'
      run: python main.py

    - name: 🗓️ 일일 실행 로그 생성
      if: always() && steps.preflight.outputs.skip != 'true'
      env:
        AI_PROVIDER: ${{ github.event.inputs.ai_provider || 'groq' }}
        DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'true' }}
      run: python scripts/write_daily_run_log.py

    - name: 💾 Git 커밋 및 푸시
      if: always() && github.ref == 'refs/heads/main' && steps.preflight.outputs.skip != 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME || 'JCURVEs' }}
        GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL || 'JCURVEs@users.noreply.github.com' }}
      run: |
        git config --global user.name "$GIT_AUTHOR_NAME"
        git config --global user.email "$GIT_AUTHOR_EMAIL"
        
        # archive와 daily run log를 함께 기록
        echo "📂 새로운 뉴스 아카이브와 실행 로그 기록..."
        git add archive/ logs/daily/
        
        # 커밋할 변경사항이 있는지 확인
        if git diff --staged --quiet; then
          echo "✨ 변경사항이 없습니다."
        else
          git commit -m "docs: Daily thread-auto run $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git push
          echo "✅ 아카이브 푸시 완료"
        fi

    - name: 📊 실행 결과 요약
      if: always()
      run: |
        echo "## Thread-Auto 실행 완료" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- 실행 시간: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "- 중복 방지로 건너뜀: ${{ steps.preflight.outputs.skip }}" >> $GITHUB_STEP_SUMMARY
        echo "- AI Provider: ${{ github.event.inputs.ai_provider || 'groq' }}" >> $GITHUB_STEP_SUMMARY
        echo "- DRY_RUN 모드: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'true' }}" >> $GITHUB_STEP_SUMMARY
