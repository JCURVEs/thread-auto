name: Thread-Auto Daily Run

on:
  schedule:
    # 매일 한국 시간 오전 9시 (UTC 00:00) 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 버튼 (테스트용)
    inputs:
      ai_provider:
        description: 'AI Provider (groq, openrouter, gemini)'
        required: false
        default: 'groq'
      dry_run:
        description: 'Dry Run Mode (true/false)'
        required: false
        default: 'true'

jobs:
  thread-auto-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 리포지토리 체크아웃
      uses: actions/checkout@v4

    - name: 🐍 Python 설정 (3.10)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 📦 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 Thread-Auto 파이프라인 실행
      env:
        # AI Provider 설정 (기본: Groq - 무료, 빠름)
        AI_PROVIDER: ${{ github.event.inputs.ai_provider || 'groq' }}
        AI_MODEL: ${{ vars.AI_MODEL || '' }}
        
        # API Keys (GitHub Secrets에 등록)
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        
        # Threads 설정
        THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        
        # RSS 및 실행 모드
        RSS_URL: ${{ vars.RSS_URL || 'https://techcrunch.com/feed/' }}
        DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'true' }}
      run: python main.py

    - name: 💾 Git 커밋 및 푸시
      if: github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "Thread-Auto Bot"
        git config --global user.email "actions@github.com"
        
        # archive 폴더가 있는지 확인하고 추가
        echo "📂 새로운 뉴스 아카이빙..."
        git add archive/
        
        # 커밋할 변경사항이 있는지 확인
        if git diff --staged --quiet; then
          echo "✨ 변경사항이 없습니다."
        else
          git commit -m "docs: Daily news archive $(date +'%Y-%m-%d')"
          git push
          echo "✅ 아카이브 푸시 완료"
        fi

    - name: 📊 실행 결과 요약
      if: always()
      run: |
        echo "## Thread-Auto 실행 완료" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- 실행 시간: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "- AI Provider: ${{ github.event.inputs.ai_provider || 'groq' }}" >> $GITHUB_STEP_SUMMARY
        echo "- DRY_RUN 모드: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'true' }}" >> $GITHUB_STEP_SUMMARY

    - name: 📂 아카이브 저장 (Commit & Push)
      run: |
        git config --global user.name "Thread-Auto Bot"
        git config --global user.email "bot@noreply.github.com"
        
        # archive 디렉토리가 있을 때만 실행
        if [ -d "archive" ]; then
          git add archive/
          # 변경사항이 있을 때만 커밋
          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily archive [skip ci]"
            git push
            echo "✅ 아카이브 업데이트 완료"
          else
             echo "ℹ️ 변경된 아카이브 파일이 없습니다."
          fi
        fi
