name: Thread-Auto Daily Run

on:
  schedule:
    # 매일 한국 시간 오전 9시 (UTC 00:00) 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 버튼 (테스트용)
    inputs:
      ai_provider:
        description: 'AI Provider (openrouter, groq, gemini)'
        required: false
        default: 'openrouter'
      dry_run:
        description: 'Dry Run Mode (true/false)'
        required: false
        default: 'true'

jobs:
  thread-auto-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Git 푸시 권한

    steps:
    - name: 📥 리포지토리 체크아웃
      uses: actions/checkout@v4

    - name: 🐍 Python 설정 (3.10)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 📦 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium

    - name: 🚀 Thread-Auto 파이프라인 실행
      env:
        # AI Provider 설정 (기본: OpenRouter + Qwen3.8)
        AI_PROVIDER: ${{ github.event.inputs.ai_provider || 'openrouter' }}
        AI_PROVIDER_FALLBACKS: ${{ vars.AI_PROVIDER_FALLBACKS || 'openrouter,groq,gemini' }}
        AI_MODEL: ${{ vars.AI_MODEL || '' }}
        OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'qwen/qwen3.8-flash' }}
        GROQ_MODEL: ${{ vars.GROQ_MODEL || '' }}
        GEMINI_MODEL: ${{ vars.GEMINI_MODEL || '' }}
        
        # API Keys (GitHub Secrets에 등록)
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        
        # Threads 설정
        THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

        # RSS 및 실행 모드 (빈 값 = 모든 AI 회사 블로그에서 수집)
        RSS_URL: ${{ vars.RSS_URL || '' }}
        COLLECT_ALL_SOURCES: 'true'
        DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'true' }}
        REQUIRE_DAILY_ARTICLE: 'true'
        ENABLE_FALLBACK_ARCHIVE: 'true'
      run: python main.py

    - name: 🗓️ 일일 실행 로그 생성
      if: always()
      env:
        AI_PROVIDER: ${{ github.event.inputs.ai_provider || 'openrouter' }}
        DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'true' }}
      run: python scripts/write_daily_run_log.py

    - name: 💾 Git 커밋 및 푸시
      if: always() && github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME || 'JCURVEs' }}
        GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL || 'JCURVEs@users.noreply.github.com' }}
      run: |
        git config --global user.name "$GIT_AUTHOR_NAME"
        git config --global user.email "$GIT_AUTHOR_EMAIL"
        
        # archive와 daily run log를 함께 기록
        echo "📂 새로운 뉴스 아카이브와 실행 로그 기록..."
        git add archive/ logs/daily/
        
        # 커밋할 변경사항이 있는지 확인
        if git diff --staged --quiet; then
          echo "✨ 변경사항이 없습니다."
        else
          git commit -m "docs: Daily thread-auto run $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git push
          echo "✅ 아카이브 푸시 완료"
        fi

    - name: 📊 실행 결과 요약
      if: always()
      run: |
        echo "## Thread-Auto 실행 완료" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- 실행 시간: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "- AI Provider: ${{ github.event.inputs.ai_provider || 'openrouter' }}" >> $GITHUB_STEP_SUMMARY
        echo "- DRY_RUN 모드: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'true' }}" >> $GITHUB_STEP_SUMMARY
