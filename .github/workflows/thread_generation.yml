name: Thread Generation

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Content type'
        required: true
        type: choice
        options:
          - news
          - paper
          - company
      input:
        description: 'Input (date/URL/company name)'
        required: true
        type: string

  # 뉴스는 daily_news 완료 후 자동 트리거
  workflow_run:
    workflows: ["Thread-Auto Daily Run"]
    types:
      - completed

jobs:
  generate-threads:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Show thread generation info
        env:
          CONTENT_TYPE: ${{ inputs.type || 'news' }}
          INPUT_DATA: ${{ inputs.input || 'latest' }}
        run: |
          echo "=========================================="
          echo "Thread Generation Request"
          echo "=========================================="
          echo "Content Type: $CONTENT_TYPE"
          echo "Input: $INPUT_DATA"
          echo ""
          python thread_generator.py --type "$CONTENT_TYPE" --input "$INPUT_DATA"

      - name: Commit generated threads
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME || 'JCURVEs' }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL || 'JCURVEs@users.noreply.github.com' }}
        run: |
          git config --global user.name "$GIT_AUTHOR_NAME"
          git config --global user.email "$GIT_AUTHOR_EMAIL"

          git add threads/

          if git diff --staged --quiet; then
            echo "✨ 생성된 스레드 변경사항이 없습니다."
          else
            git commit -m "docs: Generate thread drafts"
            git push
            echo "✅ 스레드 초안 푸시 완료"
          fi

      - name: Summary
        run: |
          echo "✅ Thread generation complete"
          echo ""
          echo "📝 Draft files are saved under threads/"
          echo "🎯 Review generated drafts before posting"
          echo ""
          echo "📚 Available agents:"
          ls -1 .claude/agents/
